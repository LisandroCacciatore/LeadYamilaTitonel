<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Valor — Lic. Yamila Titonel</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* ==========================================================================
   brand/brand.css — FUENTE ÚNICA DE LA IDENTIDAD VISUAL
   Ningún template declara colores, fuentes ni medidas propias.
   Si algo visual falta, se agrega ACÁ.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. TOKENS
   -------------------------------------------------------------------------- */
:root {
  /* Marca */
  --brand-default: #4A6770;
  --brand-hover:   #3D545C;
  --brand-soft:    #F0F4F6;

  /* Texto */
  --ink-title: #2C343C;
  --ink-body:  #5A6672;
  --ink-muted: #7A8794;

  /* Líneas y superficies */
  --line-default:    #E3E6EA;
  --surface-default: #FFFFFF;
  --surface-alt:     #F7F8FA;

  /* Estados */
  --success: #28A745;
  --warning: #FFC107;
  --error:   #DC3545;
  --info:    #17A2B8;

  /* Tipografía */
  --font-sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-sm:   0.875rem;
  --fs-base: 1rem;
  --fs-lg:   1.125rem;
  --fs-xl:   1.25rem;
  --fs-2xl:  1.5rem;
  --fs-3xl:  1.875rem;
  --fw-regular:   400;
  --fw-medium:    500;
  --fw-bold:      600;
  --fw-extrabold: 800;

  /* Espaciado (grid de 8px) */
  --space-1:  0.25rem;
  --space-2:  0.5rem;
  --space-3:  0.75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  /* Radios y sombras */
  --radius-sm:   0.25rem;
  --radius-md:   0.5rem;
  --radius-lg:   1rem;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
  --shadow-md: 0 4px 6px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.10), 0 4px 6px rgba(0,0,0,.08);
}

/* --------------------------------------------------------------------------
   2. BASE
   -------------------------------------------------------------------------- */
html { font-size: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.6;
  color: var(--ink-body);
  background: var(--surface-alt);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { color: var(--ink-title); margin: 0 0 var(--space-3); line-height: 1.25; }
h1 { font-size: var(--fs-3xl); font-weight: var(--fw-extrabold); }
h2 { font-size: var(--fs-xl);  font-weight: var(--fw-bold); }
h3 { font-size: var(--fs-base); font-weight: var(--fw-bold); }
p  { margin: 0 0 var(--space-4); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-sm);
       background: var(--brand-soft); padding: 1px 5px; border-radius: var(--radius-sm); }
ul, ol { margin: 0 0 var(--space-4); padding-left: var(--space-6); }
li { margin-bottom: var(--space-2); }

/* --------------------------------------------------------------------------
   3. HEADER / FOOTER COMPARTIDOS
   -------------------------------------------------------------------------- */
.brand-header {
  background: var(--brand-default);
  color: var(--surface-default);
}
.brand-header-inner {
  max-width: 210mm;
  margin: 0 auto;
  padding: var(--space-3) var(--space-6);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.brand-logo { width: 34px; height: 34px; display: block; flex: none; }
.brand-logo svg { width: 100%; height: 100%; display: block; }
.brand-info { display: flex; flex-direction: column; line-height: 1.2; }
.brand-title { font-weight: var(--fw-bold); font-size: var(--fs-sm); }
.brand-role  { font-size: var(--fs-sm); opacity: .75; }
.brand-doc {
  margin-left: auto;
  font-size: var(--fs-sm);
  opacity: .85;
  text-align: right;
}

.brand-footer { background: var(--surface-default); border-top: 1px solid var(--line-default); }
.brand-footer-inner {
  max-width: 210mm;
  margin: 0 auto;
  padding: var(--space-3) var(--space-6);
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
}

/* --------------------------------------------------------------------------
   4. LAYOUT DEL DOCUMENTO
   -------------------------------------------------------------------------- */
.content { max-width: 210mm; margin: 0 auto; padding: var(--space-8) var(--space-6); }
.section { margin-bottom: var(--space-10); }
.cover { text-align: center; padding: var(--space-12) 0; }
.cover h1 { font-size: var(--fs-3xl); }
.cover h2 { color: var(--brand-default); font-size: var(--fs-2xl); }
.eyebrow {
  display: inline-block;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--brand-default);
  background: var(--brand-soft);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
}
.lead { font-size: var(--fs-lg); color: var(--ink-body); }

/* --------------------------------------------------------------------------
   5. HALLAZGOS Y EVIDENCIA
   -------------------------------------------------------------------------- */
.finding {
  background: var(--surface-default);
  border: 1px solid var(--line-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-3);
}
.finding-head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}
.finding-title { font-weight: var(--fw-bold); color: var(--ink-title); font-size: var(--fs-sm); }
.finding p { margin: 0 0 var(--space-3); font-size: var(--fs-sm); }
.finding-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  border-top: 1px solid var(--line-default);
  padding-top: var(--space-3);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
}
.finding-meta strong { color: var(--ink-title); }
.finding-meta .tag { margin-left: auto; }

.tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  background: var(--brand-soft);
  color: var(--brand-default);
}
.tag-medido    { background: rgba(40,167,69,.12);   color: #1E7E34; }
.tag-inferible { background: rgba(23,162,184,.12);  color: #11707F; }
.tag-noverif   { background: rgba(220,53,69,.10);   color: #A71D2A; }

.evidence { font-size: var(--fs-sm); }

/* Callout oscuro (costo de no hacer nada) */
.callout {
  background: var(--ink-title);
  color: var(--surface-default);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
}
.callout .callout-label {
  font-size: 0.7rem; font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .08em; opacity: .6; margin-bottom: var(--space-3);
}
.callout .callout-strong { font-size: var(--fs-2xl); font-weight: var(--fw-bold); margin-bottom: var(--space-3); }
.callout .callout-note { font-size: var(--fs-sm); opacity: .7; margin: 0; }

/* --------------------------------------------------------------------------
   6. TABLAS Y PRECIOS
   -------------------------------------------------------------------------- */
.price-table { width: 100%; border-collapse: collapse; margin: var(--space-4) 0; font-size: var(--fs-sm); }
.price-table th, .price-table td {
  border: 1px solid var(--line-default);
  padding: var(--space-3);
  text-align: left;
}
.price-table th { background: var(--surface-alt); font-weight: var(--fw-bold); color: var(--ink-title); }
.price-table td:nth-child(2) { white-space: nowrap; font-weight: var(--fw-bold); color: var(--ink-title); }

.base-card {
  background: var(--surface-default);
  border: 2px solid var(--brand-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-3);
  position: relative;
}
.base-flag {
  position: absolute; top: 0; right: 0;
  background: var(--brand-default); color: var(--surface-default);
  font-size: 0.65rem; font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .08em; padding: 4px 10px; border-radius: 0 var(--radius-lg) 0 var(--radius-lg);
}
.base-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-3); }
.base-label { font-size: 0.7rem; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: .08em; color: var(--brand-default); }
.base-price { font-weight: var(--fw-bold); color: var(--ink-title); white-space: nowrap; }

/* --------------------------------------------------------------------------
   7. SELECTOR INTERACTIVO
   -------------------------------------------------------------------------- */
.module-card {
  background: var(--surface-default);
  border: 1px solid var(--line-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-3);
  cursor: pointer;
  transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
}
.module-card:hover { box-shadow: var(--shadow-sm); }
.module-card.on { border: 2px solid var(--brand-default); background: var(--brand-soft); }
.module-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-2); }
.module-code { font-size: 0.7rem; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: .08em; color: var(--brand-default); }
.module-title { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--ink-title); margin: 0; }
.module-price { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--ink-title); white-space: nowrap; }
.module-short { font-size: var(--fs-sm); margin-bottom: var(--space-2); }
.module-bullets { list-style: none; padding: 0; margin: 0; font-size: var(--fs-sm); color: var(--ink-muted); }
.module-bullets li { margin-bottom: 2px; }
.module-bullets li::before { content: '· '; }

.total-bar {
  position: sticky;
  bottom: var(--space-4);
  background: var(--ink-title);
  color: var(--surface-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
}
.total-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
.total-value { font-size: var(--fs-2xl); font-weight: var(--fw-bold); }
.total-list  { font-size: var(--fs-sm); opacity: .75; margin-top: 2px; }
.total-value.pulse { animation: pulse .35s ease; }
@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.07); color: var(--brand-soft); }
  100% { transform: scale(1); }
}

/* --------------------------------------------------------------------------
   8. BOTONES
   -------------------------------------------------------------------------- */
.btn {
  display: inline-block;
  font-family: inherit;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  text-decoration: none;
  cursor: pointer;
  transition: background-color .2s ease, color .2s ease;
}
.btn-light { background: var(--surface-default); color: var(--ink-title); }
.btn-light:hover { background: var(--brand-soft); }
.btn-ghost { background: transparent; color: var(--brand-default); text-transform: none; letter-spacing: 0; padding: var(--space-1); }

/* --------------------------------------------------------------------------
   9. ALCANCE
   -------------------------------------------------------------------------- */
.scope {
  background: var(--surface-alt);
  border: 1px solid var(--line-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.scope-label { font-size: 0.7rem; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin-bottom: var(--space-3); }
.scope ul { list-style: none; padding: 0; margin: 0; font-size: var(--fs-sm); }
.scope li { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
.scope .yes { color: var(--brand-default); }
.scope .no  { color: var(--ink-muted); }

/* --------------------------------------------------------------------------
   10. PRIORIDAD DE HALLAZGOS
   -------------------------------------------------------------------------- */
.tag-prio-alta  { background: rgba(220,53,69,.12);  color: #A71D2A; }
.tag-prio-media { background: rgba(255,193,7,.20);  color: #8A6100; }
.tag-prio-baja  { background: rgba(122,135,148,.16); color: #5A6672; }

/* --------------------------------------------------------------------------
   11. COMPARATIVO VERIFICADO
   -------------------------------------------------------------------------- */
.compare-table { width: 100%; border-collapse: collapse; margin: var(--space-4) 0; font-size: 0.76rem; }
.compare-table th, .compare-table td {
  border: 1px solid var(--line-default);
  padding: 5px 7px;
  text-align: left;
  vertical-align: top;
}
.compare-table th { background: var(--surface-alt); font-weight: var(--fw-bold); color: var(--ink-title); }
.compare-table .row-client { background: var(--brand-soft); font-weight: var(--fw-bold); }
.compare-table .ok   { color: #1E7E34; font-weight: var(--fw-bold); }
.compare-table .bad  { color: #A71D2A; font-weight: var(--fw-bold); }
.compare-table .meh  { color: var(--ink-muted); }
.evsrc { font-size: 0.72rem; color: var(--ink-muted); margin: var(--space-2) 0 0; }

/* --------------------------------------------------------------------------
   12. INDICADORES
   -------------------------------------------------------------------------- */
.kpi-row { display: flex; gap: var(--space-3); margin: var(--space-4) 0; }
.kpi {
  flex: 1;
  background: var(--surface-default);
  border: 1px solid var(--line-default);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  text-align: center;
}
.kpi__value { display: block; font-size: var(--fs-2xl); font-weight: var(--fw-extrabold); color: var(--ink-title); }
.kpi__label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); margin-top: 2px; }

/* --------------------------------------------------------------------------
   13. CITA Y VOZ DEL CLIENTE
   -------------------------------------------------------------------------- */
.quote {
  background: var(--surface-default);
  border-left: 3px solid var(--brand-default);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: var(--space-4) var(--space-5);
  margin: 0 0 var(--space-3);
  font-style: italic;
  color: var(--ink-title);
}
.quote__who { display: block; font-style: normal; font-size: 0.78rem; color: var(--ink-muted); margin-top: var(--space-2); }

/* Bloque de datos por confirmar (lo que no puedo verificar) */
.todo {
  background: var(--surface-alt);
  border: 1px dashed var(--line-default);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.todo ul { margin: 0; font-size: var(--fs-sm); }

/* --------------------------------------------------------------------------
   14. LAYOUT DE LA PROPUESTA COMERCIAL
   La propuesta es una página web que se lee en pantalla y también se imprime.
   Sólo se declaran acá la disposición y los ritmos; los colores son los tokens.
   -------------------------------------------------------------------------- */
.band { background: var(--surface-default); border-top: 1px solid var(--line-default); border-bottom: 1px solid var(--line-default); }
.band--ink { background: var(--ink-title); color: var(--surface-default); border: none; }
.band--ink h1, .band--ink h2, .band--ink h3 { color: var(--surface-default); }
.band--soft { background: var(--brand-soft); }
.wrap { max-width: 210mm; margin: 0 auto; padding: var(--space-8) var(--space-6); }
.wrap--tight { padding: var(--space-6) var(--space-6); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.hero-h1 { font-size: 2.25rem; line-height: 1.15; font-weight: var(--fw-extrabold); letter-spacing: -0.01em; }
.cta-row { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
.btn-ink { background: var(--ink-title); color: var(--surface-default); }
.btn-ink:hover { background: var(--brand-default); }
.btn-brand { background: var(--brand-default); color: var(--surface-default); }
.btn-brand:hover { background: var(--brand-hover); }
.btn-wa { background: #128C7E; color: #FFFFFF; }
.btn-wa:hover { background: #0E6E63; }
.step-list { counter-reset: paso; list-style: none; padding: 0; }
.step-list li { counter-increment: paso; position: relative; padding-left: var(--space-8); margin-bottom: var(--space-4); }
.step-list li::before {
  content: counter(paso);
  position: absolute; left: 0; top: 0;
  width: 22px; height: 22px; border-radius: var(--radius-full);
  background: var(--brand-default); color: var(--surface-default);
  font-size: 0.72rem; font-weight: var(--fw-bold);
  display: flex; align-items: center; justify-content: center;
}
.shot {
  border: 1px solid var(--line-default);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--surface-alt);
}
.shot img { display: block; width: 100%; height: auto; }
.shot__cap { font-size: 0.72rem; color: var(--ink-muted); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--line-default); background: var(--surface-default); }

/* La propuesta también se imprime: sin barra fija, sin saltos raros. */
@media print {
  .no-print { display: none !important; }
  .total-bar { position: static; }
  .band, .band--ink, .band--soft { break-inside: avoid; }
  .wrap { padding: 0 0 var(--space-6); max-width: none; }
  body { background: #FFFFFF; }
  a[href^="http"]::after { content: ""; }
}

/* Las reglas de impresión viven en templates/print.css.
   brand.css define la marca; el layout de hoja es responsabilidad del template. */

/* Identidad del cliente: el color lo pone su config, no el sistema */
:root {
  --brand-default: #2f6b4f;
  --brand-hover:   #275A42;
  --brand-soft:    #EEF3F1;
}

/* ==========================================================================
   templates/print.css — LAYOUT DE HOJAS PARA EL INFORME
   No define marca: usa los tokens de brand.css, que se inyecta antes.

   MODELO DE PAGINADO (portado de ~/propuestas/print.js, que ya funciona)
   Chrome no soporta las cajas de margen de @page (@top-left, @bottom-right) y
   `position: fixed` en impresión se encima sobre el contenido. Así que acá NO
   hay position:fixed ni cajas de margen:

     - cada hoja es un <div class="page"> de 210x296mm
     - el membrete y el pie van DENTRO de cada hoja, como bloques del flujo
     - el paginador (print.js) llena cada cuerpo midiendo el desborde real

   296mm y no 297: con 297 Chrome agrega una hoja en blanco al final.
   ========================================================================== */

@page { size: A4; margin: 0; }

html, body { margin: 0; padding: 0; background: #fff; }

/* ---------- La hoja ---------- */

.page {
  width: 210mm;
  height: 296mm;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface-default);
  page-break-after: always;
  break-after: page;
  position: relative;
}
.page:last-child { page-break-after: auto; break-after: auto; }

.page__body {
  flex: 1 1 auto;
  overflow: hidden;
  padding: 6mm 14mm 4mm;
}

/* ---------- Portada (sin membrete ni pie) ---------- */

.page--cover { justify-content: center; }

.cover { padding: 0 20mm; }
.cover__brand-name { font-weight: var(--fw-bold); color: var(--brand-default); }
.cover__label {
  font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-muted); float: right;
}
.cover__eyebrow {
  font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .1em; color: var(--brand-default); margin-bottom: var(--space-3);
}
.cover__title { font-size: 34pt; line-height: 1.1; margin: 0 0 var(--space-4); }
.cover__subtitle { font-size: var(--fs-lg); color: var(--ink-body); margin-bottom: var(--space-8); }
.cover__client {
  border-left: 3px solid var(--brand-default);
  padding: var(--space-2) 0 var(--space-2) var(--space-4);
  margin-bottom: var(--space-10);
}
.cover__client-label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted);
}
.cover__client-name { font-size: var(--fs-2xl); font-weight: var(--fw-bold); color: var(--ink-title); }
.cover__client-sub { color: var(--ink-body); }
.cover__meta {
  display: flex; gap: var(--space-8); flex-wrap: wrap;
  border-top: 1px solid var(--line-default); padding-top: var(--space-4);
  font-size: var(--fs-sm); color: var(--ink-muted);
}
.cover__meta strong { display: block; color: var(--ink-title); }

/* ---------- Encabezado de sección ---------- */

.sec-head {
  display: flex; align-items: baseline; gap: var(--space-3);
  border-bottom: 2px solid var(--brand-default);
  padding-bottom: var(--space-2); margin-bottom: var(--space-5);
}
.sec-num {
  font-size: var(--fs-sm); font-weight: var(--fw-extrabold);
  color: var(--brand-default); letter-spacing: .08em;
}
.sec-title { margin: 0; font-size: var(--fs-2xl); }
.sec-sub {
  font-size: var(--fs-sm); font-weight: var(--fw-bold); text-transform: uppercase;
  letter-spacing: .08em; color: var(--brand-default);
  margin: var(--space-5) 0 var(--space-3);
}
.sec-lead { font-size: var(--fs-base); color: var(--ink-body); margin-bottom: var(--space-5); }
.cont-label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-muted); margin-bottom: var(--space-3);
}

/* ---------- Índice ---------- */

.toc { list-style: none; padding: 0; margin: 0; }
.toc li {
  border-bottom: 1px dotted var(--line-default);
  padding: var(--space-2) 0;
}
.toc a { text-decoration: none; display: flex; gap: var(--space-3); }

(function () {

  function overflows(clear) {

  // ---------------- Documento ----------------

  /* Secciones del informe.
     Las marcadas como `optional` sólo entran si la config trae su dato: así el
     mismo paginador sirve para un informe corto y para uno con comparativo
     verificado, sin numerar huecos. La numeración se asigna después de filtrar. */
  var ALL_SECTIONS = [
    { id: 'resumen',     title: 'Resumen Ejecutivo' },
    { id: 'diagnostico', title: 'Diagnóstico' },
    { id: 'comparativo', title: 'Comparativo verificado', optional: true },
    { id: 'alcance',     title: 'Alcance de esta revisión' },
    { id: 'cierre',      title: 'Qué propongo hacer con esto' }
  ];

  function resolveSections() {
    var comp = cfg.comparativo || {};
    // La tabla puede ser de pares medidos (va al informe) o un comparativo de mercado
    // orientativo (sólo tiene sentido en la propuesta, no bajo el título "verificado").
    var tieneComparativo = (comp.filas || []).length > 0 && comp.mostrarEnInforme !== false;
    return ALL_SECTIONS.filter(function (s) {
      return !s.optional || tieneComparativo;
    }).map(function (s, i) {
      return { id: s.id, num: ('0' + (i + 1)).slice(-2), title: s.title };
    });
  }

  function compareTable(comp) {
    var cols = comp.columnas || [];
    var head = '<thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>';
    var rows = (comp.filas || []).map(function (f) {
      var celdas = (f.celdas || []).map(function (c, i) {
        var txt = String(c);
        var cls = '';
        if (i > 0) {
          if (/^(200|✓)/.test(txt)) cls = 'ok';
          else if (/✗|404|0$|no resuelve|bloqueó/.test(txt)) cls = 'bad';
          else if (txt === '—') cls = 'meh';
        }
        return '<td class="' + cls + '">' + esc(txt) + '</td>';
      }).join('');
      return '<tr class="' + (f.cliente ? 'row-client' : '') + '">' + celdas + '</tr>';
    }).join('');
    return '<table class="compare-table">' + head + '<tbody>' + rows + '</tbody></table>';
  }

  function kpiRow(kpis) {
    // §4.1 del spec editorial: máximo 4 números en el cuadro.
    kpis = (kpis || []).slice(0, 4);
    if (!(kpis || []).length) return null;
    return el('div', 'kpi-row', kpis.map(function (k) {
      return '<div class="kpi"><span class="kpi__value">' + esc(k.valor) +
             '</span><span class="kpi__label">' + esc(k.label) + '</span></div>';
    }).join(''));
  }

  function buildDocument() {
    try {
      var m = cfg.meta || {};
      var hallazgos = cfg.hallazgos || [];
      var modulos = cfg.modulos || [];
      var pasos = cfg.nextSteps || [];
      var t = totals();

      var SECTIONS = resolveSections();
      var NUM = {};
      SECTIONS.forEach(function (s) { NUM[s.id] = s.num; });

      docEl().innerHTML = '';
      sheets.length = 0;

      buildCover();

      // Índice: se crea ahora para fijar su lugar, se llena al final.
      var tocSheet = emptySheet();
      var tocBody = tocSheet.querySelector('.page__body');
      tocBody.appendChild(secHead('', 'Índice del informe'));

      var startOf = {};

      // --- 01 Resumen Ejecutivo
      openSheet();
      startOf.resumen = sheets.length;
      body.appendChild(secHead(NUM.resumen, 'Resumen Ejecutivo'));
      var resumenLead = 'Sobre ' + esc(m.url || 'su presencia online') + ' se midieron <strong>' +
        hallazgos.length + ' hallazgos</strong> que están costando oportunidades. ';
      // §7.1: la tarifa del profesional se nombra UNA sola vez, en la sección de costo.
      // Acá va sin monto: la cuenta está abajo, a la vista.
      resumenLead += cfg.costoMensual
        ? 'La cuenta de lo que eso cuesta por mes está en la sección de costo, con el cálculo a la vista.'
        : 'No declaro un impacto en pesos porque no tengo acceso a tus números: ' +
          'lo que sigue es lo medido, con la cuenta a la vista.';
      body.appendChild(el('p', 'sec-lead', resumenLead));
      place(el('ul', '', hallazgos.map(function (h) {
        return '<li><strong>' + esc(h.titulo) + '</strong> — ' + esc(h.impacto) + '</li>';
      }).join('')));

      // Los indicadores van acá, en el resumen: es lo que se lee si sólo se lee una hoja.
      var kpisResumen = kpiRow((cfg.comparativo || {}).kpis || []);
      if (kpisResumen) place(kpisResumen);
      place(el('div', 'scope',
        '<div class="scope-label">Cómo leer este informe</div>' +
        '<ul>' +
          '<li><span class="yes">✓</span> <strong>[MEDIDO]</strong>: sale de una medición sobre el HTML servido ' +
            'del sitio, verificable con los comandos que figuran en «Alcance de esta revisión».</li>' +
          '<li><span class="no">✗</span> <strong>[INFERIBLE]</strong>: es una estimación. El impacto real ' +
            'depende de tu operación, que este informe no ve.</li>' +
          '<li><span class="no">✗</span> <strong>[NO VERIFICADO]</strong>: no se pudo comprobar y por lo tanto ' +
            'no se afirma. Es el caso de LinkedIn, que responde con muro de registro.</li>' +
        '</ul>'));

      // --- 02 Diagnóstico
      openSheet();
      startOf.diagnostico = sheets.length;
      body.appendChild(secHead(NUM.diagnostico, 'Diagnóstico'));
      var nComp = Number(cfg.comparativos || 0);
      var diagLead = 'Se analizó el HTML servido de ' + esc(m.url || '') + ' el ' + esc(m.fecha || '') + '. ';
      if (nComp >= 2) {
        diagLead += 'Se comparó contra ' + nComp + ' referencias del mismo rubro, medidas el mismo día ' +
          'con la misma herramienta. ';
      } else if (nComp === 1) {
        diagLead += 'Se comparó contra una referencia del rubro, con la misma herramienta y el mismo día. ';
      }
      diagLead += 'Cada número de este informe es reproducible.';
      body.appendChild(el('p', 'sec-lead', diagLead));
      body.appendChild(el('div', 'sec-sub', 'Hallazgos'));
      flow(hallazgos.map(findingCard), 'Diagnóstico · continúa');
      var co = cfg.callout || {};
      place(callout(co.label || 'Costo de no hacer nada', [
        co.strong || ('Seguir así cuesta ' + (cfg.costoMensual || '') + ' por mes.'),
        co.note || ('Cálculo basado en ' + (cfg.baseCalculo || '') + ' · [INFERIBLE]')
      ]), 'Diagnóstico · continúa');

      // --- 03 Comparativo verificado (opcional: sólo si la config lo trae)
      var comp = cfg.comparativo || {};
      if (NUM.comparativo && (comp.filas || []).length) {
        openSheet();
        startOf.comparativo = sheets.length;
        body.appendChild(secHead(NUM.comparativo, 'Comparativo verificado'));
        if (comp.intro) body.appendChild(el('p', 'sec-lead', esc(comp.intro)));
        place(el('div', '', compareTable(comp)), 'Comparativo verificado · continúa');
        if (comp.nota) place(el('p', 'evsrc', esc(comp.nota)), 'Comparativo verificado · continúa');
        if (comp.medidoEl) {
          place(el('p', 'evsrc', 'Medición propia del ' + esc(comp.medidoEl) +
            ' · reproducible con: python scripts/medir.py --pares 00-auditoria/pares.txt'),
            'Comparativo verificado · continúa');
        }
      }

      // --- §4: acá NO va la propuesta ni la inversión. El informe es diagnóstico;
      // la solución, los precios y la aceptación viven en /propuesta/ y se enlazan
      // en la sección de cierre.


      // --- Alcance de esta revisión
      openSheet();
      startOf.alcance = sheets.length;
      body.appendChild(secHead(NUM.alcance, 'Alcance de esta revisión'));
      // El alcance sale de la config: qué se midió (✓) y qué no se pudo (✗).
      var alcance = cfg.alcance || [];
      var alcanceHTML = alcance.length
        ? alcance.map(function (a) {
            var t = String(a).trim();
            var marca = t.charAt(0);
            var yes = marca === '✓';
            var resto = (marca === '✓' || marca === '✗') ? t.slice(1).trim() : t;
            return '<li><span class="' + (yes ? 'yes' : 'no') + '">' + (yes ? '✓' : '✗') +
                   '</span> ' + esc(resto) + '</li>';
          }).join('')
        : '<li><span class="yes">✓</span> Se midió el HTML servido de ' + esc(m.url || '') +
          ' el ' + esc(m.fecha || '') + '.</li>';
      body.appendChild(el('div', 'scope', '<ul>' + alcanceHTML + '</ul>'));

      // --- Cierre (§4.6): el informe es diagnóstico, no vende. Manda a la propuesta.
      openSheet();
      startOf.cierre = sheets.length;
      body.appendChild(secHead(NUM.cierre, 'Qué propongo hacer con esto'));
      body.appendChild(el('p', 'sec-lead',
        'Este documento es el diagnóstico: qué se midió y qué está costando. La solución, ' +
        'con lo que incluye cada bloque y lo que cuesta, va en la propuesta.'));
      place(el('div', 'scope', '<ul>' +
        '<li><span class="yes">✓</span> Cada hallazgo de este informe tiene su bloque asociado ' +
          'en la propuesta: nada queda en el aire.</li>' +
        '<li><span class="yes">✓</span> Los precios, los escenarios y la aceptación están sólo en ' +
          'la propuesta, para que este informe no mezcle diagnóstico con venta.</li>' +
        '</ul>'), 'Cierre · continúa');
      place(el('div', 'cta-row',
        '<a class="btn btn-ink" href="../propuesta/">Ver la propuesta &rarr;</a> ' +
        '<a class="btn btn-light" href="../">Volver al inicio &rarr;</a>'), 'Cierre · continúa');

      // 4. Membrete y numeración en todas las hojas menos la portada.
      var total = sheets.length;
      sheets.forEach(function (sheet, i) {
        if (sheet.classList.contains('page--cover')) return;
        var meta = sheet.querySelector('.brand-footer-meta');
        if (meta) meta.textContent = meta.textContent + ' · Página ' + (i + 1) + ' de ' + total;
      });

      // 5. Índice, ya con las hojas resueltas.
      var tocList = el('ol', 'toc');
      SECTIONS.forEach(function (sec) {
        var n = startOf[sec.id];
        if (!n) return;
        tocList.appendChild(el('li', '',
          '<a href="#hoja-' + n + '"><span class="toc__item-name">' + esc(sec.title) +
          '</span><span class="toc__item-page">Página ' + n + '</span></a>'));
      });
      tocBody.appendChild(tocList);
      tocBody.appendChild(el('p', '',
        '<span style="font-size:9pt;color:var(--ink-muted)">El total de este informe es de ' +
        total + ' páginas.</span>'));

      // 6. Auto-verificación: ninguna hoja puede quedar con contenido cortado.
      //
      // Dos medidas, porque solas mienten:
      //   · scrollHeight cuenta los margenes de cierre, que no son contenido y no se
      //     recortan: una diferencia de pocos pixeles ahi es un falso positivo. Por eso
      //     se tolera un resto chico.
      //   · La prueba que manda es geometrica: ningún hijo puede cruzar el borde
      //     inferior real de la hoja. Eso es lo que efectivamente se cortaria al imprimir.
      var restoMarginal = 4;
      var desbordes = sheets.reduce(function (acc, sheet) {
        var b = sheet.querySelector('.page__body');
        if (!b) return acc;
        var bad = b.scrollHeight > b.clientHeight + restoMarginal;
        var limit = b.getBoundingClientRect().bottom;
        for (var i = 0; i < b.children.length && !bad; i++) {
          if (b.children[i].getBoundingClientRect().bottom > limit + 1) bad = true;
        }
        return acc + (bad ? 1 : 0);
      }, 0);

      document.body.dataset.hojas = String(total);
      document.body.dataset.desbordes = String(desbordes);

      // ?debug=1 escribe la geometría real en el título, para leerla con --dump-dom.
      if (params.get('debug') === '1') {
        document.title = 'DBG ' + sheets.map(function (s, i) {
          var b = s.querySelector('.page__body');
          if (!b) return (i + 1) + '=portada';
          var maxChild = 0;
          for (var k = 0; k < b.children.length; k++) {
            maxChild = Math.max(maxChild, b.children[k].getBoundingClientRect().bottom);
          }
          return (i + 1) + ': scrollH=' + b.scrollHeight + ' cliH=' + b.clientHeight +
            ' maxChildBot=' + Math.round(maxChild) +
            ' bodyBot=' + Math.round(b.getBoundingClientRect().bottom) +
            ' sheetBot=' + Math.round(s.getBoundingClientRect().bottom);
        }).join(' || ');
      }

      console.log('[print] ' + JSON.stringify({
        cliente: m.nombre, hojas: total, secciones: startOf,
        total: t.total, desbordes: desbordes
      }));
    } catch (err) {
      banner(String((err && err.message) || err));
      console.error('[print] FALLO', err);
    }
  }

  // ---------------- Arranque ----------------

  function run() {
    if (!cfg) {
      banner('No llegó la configuración del cliente (window.CLIENT_CONFIG).');
      return;
    }
    cfg.author = cfg.author || { nombre: 'Lisandro Cacciatore', email: 'lisandro@ejemplo.com' };
    // Sin las fuentes cargadas las alturas medidas no son las definitivas y las
    // tarjetas se reparten mal entre hojas.
    var go = function () { buildDocument(); };
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(go).catch(go);
    } else {
      go();
    }
    // El diálogo de impresión NO se abre solo: lo dispara el botón de la barra.
    // Con ?auto=1 se abre automáticamente (como hacía el original).
    if (params.get('auto') === '1') {
      setTimeout(function () {
        requestAnimationFrame(function () { requestAnimationFrame(function () { window.print(); }); });
      }, 400);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();

</script>
</body>
